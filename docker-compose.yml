services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sqlearn}
      MYSQL_USER: ${MYSQL_USER:-sqlearn}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set_MYSQL_PASSWORD_in_.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set_MYSQL_ROOT_PASSWORD_in_.env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-sqlearn}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-sqlearn}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set_APP_JWT_SECRET_in_.env}
      H2_CONSOLE_ENABLED: "false"
      PRACTICE_DB_DIR: /app/data/practice
      APP_AI_INSECURE_SSL: ${APP_AI_INSECURE_SSL:-false}
    volumes:
      - practice-data:/app/data/practice
    # 后端仅经前端 nginx 反代访问，不对外暴露端口；如需调试可取消下面注释
    # ports:
    #   - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
  practice-data:
